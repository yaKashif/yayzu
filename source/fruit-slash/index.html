<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5a3517" />
    <title>Fruit Slash</title>
    <meta
      name="description"
      content="Slice flying fruit with a swipe and dodge the bombs. A free fruit-slicing game for phone and computer, no download needed."
    />
    <link rel="canonical" href="https://yayzu.com/fruit-slash/" />
    <meta property="og:title" content="Fruit Slash" />
    <meta property="og:description" content="Slice flying fruit and dodge the bombs. Free to play in your browser." />
    <meta property="og:image" content="https://yayzu.com/games/fruit-slash/thumbnail.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%89%3C/text%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #4a2c14;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #game {
        touch-action: none; /* swipes slice fruit, never scroll or zoom */
      }
      #trail {
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }
      #hud {
        position: fixed;
        z-index: 2;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .hud-group {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .hud-right {
        margin-left: auto;
      }
      .pill {
        background: rgba(255, 250, 242, 0.9);
        color: #4a3020;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: clamp(14px, 4vw, 18px);
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }
      .pill b {
        font-variant-numeric: tabular-nums;
        margin-left: 6px;
      }
      #lives {
        display: flex;
        gap: 2px;
        font-size: 22px;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.35);
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      }
      #lives .lost {
        color: #ff3b30;
      }
      .icon {
        pointer-events: auto;
        border: 0;
        cursor: pointer;
        width: 42px;
        height: 42px;
        padding: 0;
        font-size: 17px;
        display: grid;
        place-items: center;
      }
      #flash {
        position: fixed;
        inset: 0;
        z-index: 3;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      .combo {
        position: fixed;
        z-index: 2;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: 900;
        font-size: clamp(22px, 6vw, 34px);
        text-shadow: 0 3px 0 #b5481a, 0 6px 14px rgba(0, 0, 0, 0.4);
        pointer-events: none;
        white-space: nowrap;
        animation: pop 1.1s ease-out forwards;
      }
      @keyframes pop {
        0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        100% { opacity: 0; transform: translate(-50%, -120%) scale(1); }
      }
      /* "Stage 2", "Fruit frenzy!" and other announcements, big in the middle of the board. */
      .banner {
        position: fixed;
        z-index: 2;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-weight: 900;
        font-size: clamp(32px, 10vw, 56px);
        text-shadow: 0 4px 0 #b5481a, 0 8px 22px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        white-space: nowrap;
        animation: banner 1.6s ease-out forwards;
      }
      @keyframes banner {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
        25% { transform: translate(-50%, -50%) scale(1); }
        80% { opacity: 1; transform: translate(-50%, -55%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -75%) scale(1); }
      }
      #overlay {
        position: fixed;
        z-index: 4;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(30, 16, 6, 0.45);
      }
      .card {
        width: min(400px, 100%);
        box-sizing: border-box;
        background: #fffaf2;
        border-radius: 22px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(20, 10, 0, 0.4);
        color: #4a3020;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 8vw, 36px);
        color: #d1462f;
      }
      .card p {
        margin: 0 0 18px;
        line-height: 1.45;
        font-size: 16px;
      }
      #play {
        width: 100%;
        max-width: 260px;
        min-height: 54px;
        border: 0;
        border-radius: 999px;
        background: #e8743b;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 0 #b9531f;
      }
      #play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #b9531f;
      }
      #controls {
        margin: 18px 0 0;
        font-size: 14px;
        color: #7a6250;
      }
      .more-games {
        display: inline-block;
        margin-top: 14px;
        color: #c25a22;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="board"></canvas>
    <canvas id="game"></canvas>
    <canvas id="trail"></canvas>
    <div id="flash"></div>

    <div id="hud">
      <div id="scores" class="hud-group" hidden>
        <div class="pill">Score<b id="score">0</b></div>
        <div class="pill">Best<b id="best">0</b></div>
      </div>
      <div class="hud-group hud-right">
        <div id="lives" hidden><span>✕</span><span>✕</span><span>✕</span></div>
        <button id="sound" class="pill icon" aria-label="Mute">🔊</button>
        <button id="pause" class="pill icon" aria-label="Pause" hidden>II</button>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1 id="title">Fruit Slash</h1>
        <p id="message">Slice the flying fruit. Don't let three drop, and never hit a bomb!</p>
        <button id="play">Play</button>
        <p id="controls"></p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
