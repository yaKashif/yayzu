<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8a29a" />
    <title>Wiz o Wisp</title>
    <meta
      name="description"
      content="Hop a glowing wisp up steps of light, one piano note per hop. A relaxing rhythm game for phone and computer, no download needed."
    />
    <link rel="canonical" href="https://yayzu.com/wiz-o-wisp/" />
    <meta property="og:title" content="Wiz o Wisp" />
    <meta property="og:description" content="Hop a glowing wisp up steps of light and play the song as you climb." />
    <meta property="og:image" content="https://yayzu.com/games/wiz-o-wisp/thumbnail.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #6a4a86;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none; /* taps hop the wisp, never scroll or zoom */
      }
      [hidden] {
        display: none !important;
      }
      #hud {
        position: fixed;
        z-index: 5; /* above the cards, so the song's play button works there too */
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        right: max(14px, env(safe-area-inset-right));
        display: flex;
        gap: 8px;
        pointer-events: none;
      }
      .hud-group {
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .hud-right {
        margin-left: auto;
        flex-shrink: 0;
      }
      .pill {
        background: rgba(255, 248, 242, 0.72);
        color: #6b3f55;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: clamp(13px, 3.6vw, 16px);
        font-weight: 600;
        box-shadow: 0 2px 12px rgba(110, 40, 80, 0.18);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        white-space: nowrap;
      }
      .pill b {
        font-variant-numeric: tabular-nums;
        margin-left: 6px;
      }
      .song-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        padding: 4px 16px 4px 4px;
      }
      #song {
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      /* Plays the song as written; a stop square while it plays. */
      .listen {
        pointer-events: auto;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0 0 0 2px;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #ffad66, #ec7393);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(200, 80, 110, 0.35);
      }
      .listen.playing {
        padding: 0;
        animation: listening 1.4s ease-in-out infinite;
      }
      @keyframes listening {
        50% { box-shadow: 0 0 0 6px rgba(236, 115, 147, 0.25); }
      }
      #piano {
        font-size: 13px;
        font-weight: 500;
      }
      .icon {
        pointer-events: auto;
        border: 0;
        cursor: pointer;
        width: 42px;
        height: 42px;
        padding: 0;
        font-size: 17px;
        display: grid;
        place-items: center;
      }
      /* How much of the song is played: a thin line along the very top of the screen. */
      #progress {
        position: fixed;
        z-index: 6;
        left: 0;
        right: 0;
        top: 0;
        height: 4px;
        background: rgba(255, 240, 232, 0.16);
        pointer-events: none;
      }
      #progress i {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #ffd58a, #ffb0a6, #e3b6ff);
        box-shadow: 0 0 12px rgba(255, 214, 170, 0.9);
        transition: width 0.3s ease;
      }
      #overlay {
        position: fixed;
        z-index: 4;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 68px 16px 16px; /* clear of the bar at the top */
        background: rgba(74, 36, 74, 0.26);
        overflow-y: auto; /* short landscape screens can scroll the card */
        touch-action: pan-y;
      }
      .card {
        width: min(400px, 100%);
        box-sizing: border-box;
        background: rgba(255, 249, 244, 0.9);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border-radius: 26px;
        padding: 30px 24px 22px;
        text-align: center;
        box-shadow: 0 16px 50px rgba(90, 30, 70, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        color: #5d3a50;
      }
      .card h1 {
        margin: 0 0 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 600;
        font-size: clamp(30px, 8vw, 40px);
        color: #b8496f;
      }
      .card p {
        margin: 0 0 18px;
        line-height: 1.5;
        font-size: 16px;
      }
      #play {
        width: 100%;
        max-width: 260px;
        min-height: 54px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffad66, #ec7393);
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        text-shadow: 0 1px 2px rgba(150, 40, 70, 0.35);
        box-shadow: 0 4px 0 #c2557a, 0 10px 24px rgba(236, 115, 147, 0.4);
      }
      #play:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #c2557a;
      }
      #controls {
        margin: 14px 0 0;
        font-size: 14px;
        color: #85606f;
      }
      /* Stars: gold when earned, faint when not. */
      .stars,
      .song-stars {
        display: inline-flex;
        gap: 2px;
        color: rgba(160, 100, 120, 0.25);
      }
      .stars {
        font-size: 40px;
        line-height: 1;
        margin: 0 0 12px;
        gap: 6px;
      }
      .stars .on,
      .song-stars .on {
        color: #f5b335;
        text-shadow: 0 0 10px rgba(255, 196, 80, 0.7);
      }
      .songs {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr); /* long titles shorten with "…" instead of widening the list */
        overflow-x: hidden;
        gap: 4px;
        max-height: min(40vh, 330px);
        margin: -4px -10px 16px;
        padding: 2px 10px;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y; /* the list scrolls even though the page around it doesn't */
        text-align: left;
      }
      .song {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 42px;
        border: 0;
        border-radius: 14px;
        padding: 8px 12px;
        background: rgba(255, 232, 224, 0.6);
        color: #5d3a50;
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      .song:hover:not(:disabled),
      .song:focus-visible {
        background: #ffe0d4;
      }
      .song.current {
        background: linear-gradient(135deg, #ffe2c2, #ffd5de);
        box-shadow: inset 0 0 0 2px #eea0b4;
      }
      .song:disabled {
        cursor: default;
        color: #85606f;
        background: rgba(240, 225, 225, 0.5);
      }
      .song .n {
        width: 1.4em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #8a5a70;
      }
      .song .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .song .song-stars {
        font-size: 14px;
      }
      .song .lock {
        font-size: 13px;
      }
      .links {
        display: flex;
        gap: 18px;
        justify-content: center;
      }
      .link {
        margin-top: 10px;
        border: 0;
        padding: 6px 4px;
        background: none;
        color: #b8496f;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .link[hidden] {
        display: none;
      }
      .card .credit {
        margin: 12px 0 0;
        font-size: 12px;
        color: #85606f;
      }
      .credit a {
        color: inherit;
      }
      .more-games {
        display: inline-block;
        margin-top: 14px;
        color: #b8496f;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-group">
        <div class="pill song-pill">
          <button id="listen" class="listen" aria-label="Listen to the song">▶</button>
          <span id="song">Twinkle Twinkle Little Star</span>
        </div>
        <div id="streak-pill" class="pill" hidden>Streak<b id="streak">0</b></div>
      </div>
      <div class="hud-group hud-right">
        <div id="piano" class="pill" hidden>Piano 0%</div>
        <button id="sound" class="pill icon" aria-label="Mute">🔊</button>
        <button id="pause" class="pill icon" aria-label="Pause" hidden>II</button>
      </div>
    </div>
    <div id="progress"><i id="progress-bar"></i></div>

    <div id="overlay">
      <div class="card">
        <h1 id="title">Wiz o Wisp</h1>
        <div id="stars" hidden></div>
        <p id="message">Hop the wisp up the steps of light. Every step is a note: land on the beat and you play the song.</p>
        <div id="songs" class="songs" hidden></div>
        <button id="play">Play</button>
        <div class="links">
          <button id="again" class="link" hidden>Play again</button>
          <button id="menu" class="link" hidden>All songs</button>
        </div>
        <p id="controls"></p>
        <p class="credit" id="song-credit" hidden></p>
        <p class="credit">
          Piano: Salamander Grand Piano by Alexander Holm,
          <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
